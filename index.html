<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Versiona · PM Dashboard</title>
    <style>
        :root { --bg:#0a0a0a; --card:#161616; --text:#f0ede8; --green:#4ade80; --border:rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; margin:0; display:flex; height:100vh; }
        
        .sidebar { width: 250px; border-right: 1px solid var(--border); padding: 20px; }
        .nav-item { padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; color: gray; }
        .nav-item.active { background: var(--card); color: var(--green); }
        
        .main { flex:1; padding: 40px; overflow-y: auto; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Estilos de las tarjetas para que no se vea vacío */
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        h1 { font-family: 'DM Serif Display', serif; font-size: 32px; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h1>Versiona</h1>
        <div class="nav-item active" onclick="showView('analisis')">Análisis</div>
        <div class="nav-item" onclick="showView('clientes')">Clientes</div>
        <div class="nav-item" onclick="showView('equipo')">Equipo</div>
    </nav>

    <main class="main">
        <section id="v-analisis" class="view-section active">
            <h1>Dashboard de Análisis</h1>
            <div class="card">
                <h3>Resumen de Leads</h3>
                <p>Esperando sincronización con el formulario de captación...</p>
            </div>
        </section>

        <section id="v-clientes" class="view-section">
            <h1>Gestión de Clientes</h1>
            <div class="card">
                <p>Aquí aparecerá la lista de prospectos filtrados por Score (A, B, C).</p>
            </div>
        </section>

        <section id="v-equipo" class="view-section">
            <h1>Colaboración</h1>
            <div class="card">
                <p>Panel de asignación de tareas para el equipo de diseño.</p>
            </div>
        </section>
    </main>

    <script>
        function showView(viewId) {
            // Ocultar todas las secciones
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            // Quitar clase activa de los botones
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Mostrar la sección correcta
            document.getElementById('v-' + viewId).classList.add('active');
            // Activar botón (esto es simplificado para que funcione ya)
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
